<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">amu-ui logo</title>
  <desc id="desc">amu-ui repository logo for README</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="32" x2="1080" y2="288" gradientUnits="userSpaceOnUse">
