services:
  mysql:
    image: mysql:8.4
    container_name: amu-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-amu_admin}
      MYSQL_USER: ${MYSQL_USER:-amu_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-amu_admin_123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_123456}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amu-admin-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-amu_admin}:${MYSQL_PASSWORD:-amu_admin_123}@mysql:3306/${MYSQL_DATABASE:-amu_admin}
      AMU_ADMIN_ACCESS_SECRET: ${AMU_ADMIN_ACCESS_SECRET:-amu-admin-access-secret}
      AMU_ADMIN_REFRESH_SECRET: ${AMU_ADMIN_REFRESH_SECRET:-amu-admin-refresh-secret}
      SEED_MODE: ${SEED_MODE:-demo}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-系统管理员}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@amu-ui.com}
      SEED_ADMIN_DEPARTMENT_ID: ${SEED_ADMIN_DEPARTMENT_ID:-platform}
      SEED_ADMIN_TITLE: ${SEED_ADMIN_TITLE:-Platform Owner}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-123456}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('node:http');
          const req = http.get('http://127.0.0.1:3000/api/health/ready', (res) => {
            process.exit(res.statusCode === 200 ? 0 : 1);
          });
          req.on('error', () => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql_data:
